<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
  <title id="t">Jhonier Sneider - Aprendiz de Análisis y Desarrollo de Software</title>
  <desc id="d">Banner estilo pixel art: noche morada sobre montañas, escritorio con monitor de código, café y planta, junto a etiquetas de tecnologías.</desc>

  <defs>
    <style>
      .mono   { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
      .tw     { animation: tw 3s steps(2, end) infinite; }
      .tw2    { animation: tw 4s steps(2, end) infinite .8s; }
      .tw3    { animation: tw 5s steps(2, end) infinite 1.6s; }
      .blink  { animation: blink 1s steps(1, end) infinite; }
      .steam  { animation: steam 3s steps(4, end) infinite; }
      .steam2 { animation: steam 3s steps(4, end) infinite 1.2s; }
      .float  { animation: float 4s steps(4, end) infinite; }
      @keyframes tw    { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes steam { 0% { transform: translateY(0); opacity: .8 } 100% { transform: translateY(-14px); opacity: 0 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <!-- ===== Cielo en bandas (efecto pixel) ===== -->
  <rect y="0"   width="1200" height="60" fill="#150c2b"/>
  <rect y="60"  width="1200" height="60" fill="#1d1040"/>
  <rect y="120" width="1200" height="60" fill="#27164f"/>
  <rect y="180" width="1200" height="60" fill="#321c63"/>
  <rect y="240" width="1200" height="60" fill="#3d2276"/>

  <!-- Estrellas -->
  <g fill="#f5f3ff">
    <rect class="tw"  x="40"  y="24"  width="4" height="4"/>
    <rect class="tw2" x="150" y="48"  width="4" height="4"/>
    <rect class="tw3" x="260" y="20"  width="4" height="4"/>
    <rect class="tw"  x="380" y="56"  width="4" height="4"/>
    <rect class="tw2" x="470" y="26"  width="4" height="4"/>
    <rect class="tw3" x="560" y="64"  width="4" height="4"/>
    <rect class="tw"  x="640" y="22"  width="4" height="4"/>
    <rect class="tw2" x="760" y="30"  width="4" height="4"/>
    <rect class="tw3" x="900" y="18"  width="4" height="4"/>
    <rect class="tw"  x="1010" y="46" width="4" height="4"/>
    <rect class="tw2" x="1150" y="28" width="4" height="4"/>
    <rect class="tw3" x="1170" y="96" width="4" height="4"/>
    <rect class="tw"  x="700" y="110" width="4" height="4"/>
    <rect class="tw2" x="590" y="100" width="4" height="4"/>
  </g>

  <!-- Luna -->
  <g>
    <rect x="702" y="30" width="16" height="8" fill="#f5f3ff"/>
    <rect x="694" y="38" width="32" height="8" fill="#f5f3ff"/>
    <rect x="690" y="46" width="40" height="16" fill="#f5f3ff"/>
    <rect x="694" y="62" width="32" height="8" fill="#f5f3ff"/>
    <rect x="702" y="70" width="16" height="8" fill="#f5f3ff"/>
    <rect x="698" y="46" width="8" height="8" fill="#ddd6fe"/>
    <rect x="714" y="58" width="8" height="8" fill="#ddd6fe"/>
  </g>

  <!-- ===== Montañas (valle) ===== -->
  <path d="M0 260 V240 H48 V224 H96 V208 H144 V192 H192 V208 H240 V224 H288 V208 H336 V224 H384 V240 H432 V224 H480 V208 H528 V224 H576 V240 H640 V256 H720 V240 H768 V224 H816 V208 H864 V192 H912 V208 H960 V224 H1008 V208 H1056 V192 H1104 V208 H1152 V224 H1200 V300 H0 Z" fill="#4a2b8c"/>
  <path d="M0 300 V276 H80 V264 H160 V276 H260 V288 H380 V276 H480 V264 H560 V276 H660 V288 H1200 V300 Z" fill="#170d30"/>

  <!-- ===== Texto principal ===== -->
  <text class="mono" x="60" y="72" font-size="22" fill="#a78bfa">$ whoami</text>
  <text class="mono" x="64" y="134" font-size="56" fill="#7c3aed">Jhonier Sneider</text>
  <text class="mono" x="60" y="130" font-size="56" fill="#ffffff">Jhonier Sneider</text>
  <text class="mono" x="60" y="168" font-size="21" fill="#e9d5ff">Aprendiz de Análisis y Desarrollo de Software</text>
  <text class="mono" x="60" y="198" font-size="18" fill="#c4b5fd">Medellín, Colombia · SENA</text>

  <!-- Etiquetas de tecnologías (texto, sin logos de marca) -->
  <g class="mono" font-size="16" fill="#f5d0fe" text-anchor="middle">
    <g>
      <rect x="63"  y="223" width="56" height="34" fill="#0f0820"/><rect x="60"  y="220" width="56" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="88"  y="242">PY</text>
      <rect x="127" y="223" width="56" height="34" fill="#0f0820"/><rect x="124" y="220" width="56" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="152" y="242">JS</text>
      <rect x="191" y="223" width="72" height="34" fill="#0f0820"/><rect x="188" y="220" width="72" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="224" y="242">HTML</text>
      <rect x="271" y="223" width="64" height="34" fill="#0f0820"/><rect x="268" y="220" width="64" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="300" y="242">CSS</text>
      <rect x="343" y="223" width="64" height="34" fill="#0f0820"/><rect x="340" y="220" width="64" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="372" y="242">SQL</text>
      <rect x="415" y="223" width="64" height="34" fill="#0f0820"/><rect x="412" y="220" width="64" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="444" y="242">GIT</text>
      <rect x="487" y="223" width="72" height="34" fill="#0f0820"/><rect x="484" y="220" width="72" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="520" y="242">JAVA</text>
      <rect x="567" y="223" width="72" height="34" fill="#0f0820"/><rect x="564" y="220" width="72" height="34" fill="#2d1a58" stroke="#a855f7" stroke-width="2"/><text x="600" y="242">NODE</text>
    </g>
  </g>

  <!-- ===== Íconos flotantes genéricos ===== -->
  <!-- Llaves { } -->
  <g class="float mono">
    <text x="770" y="86" font-size="40" fill="#c084fc">{ }</text>
