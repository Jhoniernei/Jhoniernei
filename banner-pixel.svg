  <rect class="steam2" x="1058" y="212" width="4" height="8" fill="#f5f3ff"/>

  <!-- Planta -->
  <rect x="1100" y="240" width="28" height="16" fill="#c2693c"/>
  <rect x="1096" y="236" width="36" height="4" fill="#a8532b"/>
  <rect x="1112" y="212" width="6" height="24" fill="#10b981"/>
