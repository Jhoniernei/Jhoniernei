    <rect x="872" y="162" width="100" height="6" fill="#c084fc"/>
    <rect x="862" y="176" width="50" height="6" fill="#34d399"/><rect x="918" y="176" width="50" height="6" fill="#f0abfc"/>
    <rect x="852" y="190" width="24" height="6" fill="#c084fc"/>
    <rect class="blink" x="882" y="188" width="8" height="10" fill="#ffffff"/>
  </g>

  <!-- Teclado -->
  <rect x="860" y="246" width="140" height="10" fill="#2a1a52"/>
  <g fill="#6d4fc2">
    <rect x="866" y="249" width="8" height="3"/><rect x="880" y="249" width="8" height="3"/>
    <rect x="894" y="249" width="8" height="3"/><rect x="908" y="249" width="8" height="3"/>
    <rect x="922" y="249" width="8" height="3"/><rect x="936" y="249" width="8" height="3"/>
    <rect x="950" y="249" width="8" height="3"/><rect x="964" y="249" width="8" height="3"/>
    <rect x="978" y="249" width="8" height="3"/>
