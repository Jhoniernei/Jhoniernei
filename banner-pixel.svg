    <rect x="1104" y="164" width="24" height="4" fill="#7c3aed"/>
  </g>
  <!-- Ramas (diagrama genérico de control de versiones) -->
  <g class="float" style="animation-delay:3s">
    <rect x="766" y="140" width="12" height="12" fill="#f0abfc"/>
    <rect x="770" y="152" width="4" height="24" fill="#a78bfa"/>
    <rect x="766" y="176" width="12" height="12" fill="#f0abfc"/>
    <rect x="774" y="160" width="8" height="4" fill="#a78bfa"/>
    <rect x="782" y="156" width="8" height="4" fill="#a78bfa"/>
    <rect x="790" y="148" width="12" height="12" fill="#f0abfc"/>
  </g>

  <!-- ===== Escritorio ===== -->
  <!-- Resplandor del monitor -->
  <rect x="822" y="92" width="236" height="136" fill="#8b5cf6" opacity=".15"/>

  <!-- Monitor -->
  <rect x="830" y="100" width="220" height="120" fill="#0e0820" stroke="#8b5cf6" stroke-width="4"/>
  <rect x="842" y="112" width="196" height="96" fill="#120a2a"/>
  <rect x="924" y="220" width="32" height="18" fill="#3b2478"/>
  <rect x="896" y="238" width="88" height="10" fill="#3b2478"/>

  <!-- Código en pantalla -->
  <g>
    <rect x="852" y="120" width="40" height="6" fill="#c084fc"/><rect x="898" y="120" width="60" height="6" fill="#f0abfc"/>
    <rect x="862" y="134" width="70" height="6" fill="#60a5fa"/><rect x="938" y="134" width="36" height="6" fill="#a3e635"/>
