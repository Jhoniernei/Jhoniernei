  <rect x="790" y="256" width="380" height="12" fill="#8a5a33"/>
  <rect x="790" y="268" width="380" height="4" fill="#5e3b1f"/>
  <rect x="806" y="272" width="14" height="28" fill="#5e3b1f"/>
  <rect x="1140" y="272" width="14" height="28" fill="#5e3b1f"/>

